name: Build and publish Sailbox API keys

on:
  push:
    branches: [feat/api-keys]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sailbox-api-keys-image
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.repository == 'z9905080/sailbox' && github.ref == 'refs/heads/feat/api-keys'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the fork image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/z9905080/sailbox:api-keys-20261108
            ghcr.io/z9905080/sailbox:latest
          labels: |
            org.opencontainers.image.source=https://github.com/z9905080/sailbox
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=api-keys-20261108
          build-args: VERSION=api-keys-20261108
          cache-from: type=gha
          cache-to: type=gha,mode=max
